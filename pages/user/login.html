<!DOCTYPE html>
<html lang="en">
    <head>
        <title>GreenDash - Login</title>
        <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
        <link rel="stylesheet" href="../../bootstrap-icons/bootstrap-icons.css">
        <link rel="stylesheet" href="../../style/centralized.css">
        <link rel="stylesheet" href="../../style/user.css">
    </head>

    <body class="login-page">
        <main class="login-container">
            <img src="../../assets/main/GreenDash_LOGO.png" alt="Greendash Logo" class="login-logo">
            <button type="button" id="googleLoginButton" class="google-login-btn">
                <img src="../../assets/main/google_LOGO.png" alt="Google Logo" class="google-logo">
                Continue with Google
            </button>

            <a href="../vendor/login.html" class="vendor-login-btn">
                Sign in as a food vendor
            </a>
        </main>

        <script src="../../js/jquery-4.0.0.min.js"></script>
        <script src="../../js/user.js"></script>

    </body>
</html>
