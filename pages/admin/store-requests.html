<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GreenDash - Store Requests</title>

        <link rel="stylesheet" href="../../bootstrap/css/bootstrap-5.3.3.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../../style/centralized.css">
        <link rel="stylesheet" href="../../style/admin-common.css">
        <link rel="stylesheet" href="../../style/admin-tables.css">
        <link rel="stylesheet" href="../../style/admin-modals.css">
        <link rel="stylesheet" href="../../style/admin-requests.css">

        <link rel="icon" type="image/png" href="../../assets/main/GreenDash_CIRCLE.png">
    </head>
    <body class="admin-page" data-page="store-requests">
        <!-- HEADER -->
        <header>
            <div class="main-header">
                <img id="logo" src="../../assets/main/GreenDash_LOGO.png" alt="GreenDash Logo">
                <button class="icon-button" id="eclipse" type="button" aria-label="Toggle dark mode">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 2a7 7 0 1 0 10 10"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="admin-layout">
            <!-- SIDEBAR -->
            <aside class="admin-sidebar" aria-label="Admin dashboard">
                <span>Dashboard</span>

                <button class="sidebar-link" type="button"
                        data-bs-toggle="collapse" data-bs-target="#stallsMenu"
                        aria-expanded="true" aria-controls="stallsMenu">
                    <span>Stalls</span>
                    <span class="caret"><i class="bi bi-arrow-down"></i></span>
                </button>

                <div class="collapse show" id="stallsMenu">
                    <div class="submenu">
                        <a href="manage-stores.html" class="submenu-link">Manage</a>
                        <a href="store-requests.html" class="submenu-link active" aria-current="page">Requests</a>
                    </div>
                </div>

                <button class="sidebar-link" type="button"
                        data-bs-toggle="collapse" data-bs-target="#usersMenu"
                        aria-expanded="false" aria-controls="usersMenu">
                    <span>Users</span>
                    <span class="caret"><i class="bi bi-arrow-down"></i></span>
                </button>

                <div class="collapse" id="usersMenu">
                    <div class="submenu">
                        <a href="manage-users.html" class="submenu-link">Manage</a>
                    </div>
                </div>
            </aside>

            <!-- MAIN -->
            <main class="admin-content">
                <h1 class="page-title">Requests</h1>

                <div class="admin-toolbar">
                    <div class="admin-search">
                        <i class="bi bi-search"></i>
                        <input id="searchInput" type="search" placeholder="Search by Stall or Vendor...">
                    </div>

                    <input class="admin-input" id="filterMonth" type="month" aria-label="Filter by month">

                    <select class="admin-select" id="filterType" aria-label="Filter by type">
                        <option value="">All types</option>
                        <option value="Add Stall">Add Stall</option>
                        <option value="Remove Stall">Remove Stall</option>
                    </select>

                    <select class="admin-select" id="sortField" aria-label="Sort by">
                        <option value="stall">Stall name</option>
                        <option value="vendor">Vendor</option>
                        <option value="date">Date</option>
                    </select>

                    <button class="admin-icon-btn" id="sortBtn" type="button" aria-label="Toggle sort direction">
                        <i class="bi bi-sort-down-alt"></i>
                    </button>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table requests-table">
                        <thead>
                            <tr>
                                <th>Stall Name</th>
                                <th>Vendor</th>
                                <th>Date</th>
                                <th>Type</th>
                                <th class="col-actions"></th>
                            </tr>
                        </thead>
                        <tbody id="requestsBody"></tbody>
                    </table>
                </div>
            </main>
        </div>

        <!-- MODAL: Request details / approve / deny -->
        <div class="admin-modal" id="requestModal" role="dialog" aria-modal="true" aria-labelledby="requestModalTitle">
            <div class="admin-modal-card">
                <button class="close-x" type="button" data-close aria-label="Close">
                    <i class="bi bi-x-lg"></i>
                </button>
                <h2 id="requestModalTitle">Stall Name</h2>

                <div class="modal-row">
                    <span class="modal-label">Vendor Owner:</span>
                    <span class="modal-value" id="mOwner">—</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Contact:</span>
                    <span class="modal-value" id="mContact">—</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Location:</span>
                    <span class="modal-value" id="mLocation">—</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Operating Hours:</span>
                    <span class="modal-value" id="mHours">—</span>
                </div>

                <div class="modal-actions">
                    <button class="admin-btn primary" id="approveBtn" type="button">Approve</button>
                    <button class="admin-btn danger" id="denyBtn" type="button">Deny</button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="../../js/centralized.js"></script>
        <script src="../../js/admin-requests.js"></script>
    </body>
</html>
